name: Release native validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the merged or reviewed tagged release candidate
        required: true
        type: string
      delivery_mode:
        description: Native release validation or harmless hosted UI capability probe
        required: true
        default: native
        type: choice
        options:
          - native
          - probe
          - first-launch
          - update
      allow_release_identity:
        description: Explicitly allow the unchanged signed app identity on this fresh hosted VM
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-native-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  validate-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject unsupported modes before running candidate code
        env:
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
        run: |
          case "$DELIVERY_MODE" in
            native|probe|first-launch|update|'') ;;
            *) echo 'Unsupported delivery mode' >&2; exit 1 ;;
          esac

  native:
    if: inputs.delivery_mode == 'native' || inputs.delivery_mode == ''
    needs: validate-mode
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Require an explicit candidate and a default-branch or reviewed tag workflow
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            test "$WORKFLOW_REF_TYPE" = branch
          else
            test "$WORKFLOW_REF_TYPE" = tag
            NUMBER='(0|[1-9][0-9]*)'
            PRERELEASE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            TAG_PATTERN="^refs/tags/v$NUMBER\\.$NUMBER\\.$NUMBER(-$PRERELEASE(\\.$PRERELEASE)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
            [[ "$WORKFLOW_REF" =~ $TAG_PATTERN ]] || exit 1
            test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
            test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and macOS 14 arm64
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          else
            test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
            test "$SOURCE_SHA" = "$CANDIDATE_SHA"
            test "$(git rev-parse --verify "$WORKFLOW_REF^{commit}")" = "$CANDIDATE_SHA"
          fi
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-14-arm64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/xtrace-ci-tools
          key: supply-tools-macos-14-arm64-syft-1.51.1-about-0.9.2
      - name: Validate the native release candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AGENT_PLUGINS_SOURCE: bundle
          AGENT_PLUGINS_DIR: ${{ github.workspace }}/vendor/agent-plugins/plugins/memhub
        run: |
          REVIEWED_BASE_SHA="$(git rev-parse "$CANDIDATE_SHA^1")"
          pnpm check:native --base "$REVIEWED_BASE_SHA" --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.candidate_sha }}
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Signing runs only after the credential-free validation above passes, in the
  # protected macos-signing environment. Only the step that signs sees Apple values.
  package:
    if: (inputs.delivery_mode == 'native' || inputs.delivery_mode == '') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: native
    runs-on: macos-14
    timeout-minutes: 150
    environment: macos-signing
    steps:
      - name: Require an explicit candidate and the default-branch workflow
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and macOS 14 arm64
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-14-arm64
      - name: Build the release app without signing values
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm tauri build --no-bundle
      - name: Sign and notarize the app and the disk image, then check them
        env:
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: XTrace Inc. (3C8BCX5J3H)'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/ci/release-dmg.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg-${{ inputs.candidate_sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  # This job proves only fixture WKWebView Accessibility on the allocated image.
  # It never downloads/launches XTrace, validates a release or enters signing.
  ui-capability-probe:
    if: inputs.delivery_mode == 'probe'
    needs: validate-mode
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Require the reviewed workflow identity and hosted macOS 14 arm64
        env:
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$DELIVERY_MODE" = probe
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          if test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            test "$WORKFLOW_REF_TYPE" = branch
          else
            test "$WORKFLOW_REF_TYPE" = tag
            NUMBER='(0|[1-9][0-9]*)'
            PRERELEASE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            TAG_PATTERN="^refs/tags/v$NUMBER\\.$NUMBER\\.$NUMBER(-$PRERELEASE(\\.$PRERELEASE)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
            [[ "$WORKFLOW_REF" =~ $TAG_PATTERN ]] || exit 1
          fi
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Test guards and exercise the harmless offline WKWebView fixture
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --test scripts/ci/hosted-validation.test.mjs
          node scripts/ci/hosted-validation.mjs probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-ui-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hosted-validation/*.json
            artifacts/hosted-validation/*.log
          if-no-files-found: warn
          retention-days: 14

  # This opt-in runs the fixed public artifact. It never rebuilds, signs, updates or publishes.
  signed-first-launch:
    if: inputs.delivery_mode == 'first-launch'
    needs: validate-mode
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Require the reviewed workflow identity and hosted macOS 14 arm64
        timeout-minutes: 1
        env:
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          ALLOW_RELEASE_IDENTITY: ${{ inputs.allow_release_identity }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$DELIVERY_MODE" = first-launch
          test "$ALLOW_RELEASE_IDENTITY" = true
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          if test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            test "$WORKFLOW_REF_TYPE" = branch
          else
            test "$WORKFLOW_REF_TYPE" = tag
            NUMBER='(0|[1-9][0-9]*)'
            PRERELEASE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            TAG_PATTERN="^refs/tags/v$NUMBER\\.$NUMBER\\.$NUMBER(-$PRERELEASE(\\.$PRERELEASE)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
            [[ "$WORKFLOW_REF" =~ $TAG_PATTERN ]] || exit 1
          fi
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 2
        with:
          node-version-file: .node-version
      - name: Test first-launch guards
        timeout-minutes: 1
        run: node --test scripts/ci/hosted-validation.test.mjs scripts/ci/hosted-release.test.mjs scripts/ci/hosted-metadata.test.mjs
      - name: Validate the unchanged signed 0.1.6 first launch
        timeout-minutes: 11
        env:
          ALLOW_RELEASE_IDENTITY: ${{ inputs.allow_release_identity }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/ci/hosted-first-launch.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 2
        if: always()
        with:
          name: hosted-first-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hosted-first-launch/*.json
            artifacts/hosted-first-launch/*.log
          if-no-files-found: warn
          retention-days: 14

  # Only this opt-in installs an update through the released app UI.
  signed-update:
    if: inputs.delivery_mode == 'update'
    needs: validate-mode
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Require the reviewed workflow identity and hosted macOS 14 arm64
        timeout-minutes: 1
        env:
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          ALLOW_RELEASE_IDENTITY: ${{ inputs.allow_release_identity }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$DELIVERY_MODE" = update
          test "$ALLOW_RELEASE_IDENTITY" = true
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          if test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            test "$WORKFLOW_REF_TYPE" = branch
          else
            test "$WORKFLOW_REF_TYPE" = tag
            NUMBER='(0|[1-9][0-9]*)'
            PRERELEASE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            TAG_PATTERN="^refs/tags/v$NUMBER\\.$NUMBER\\.$NUMBER(-$PRERELEASE(\\.$PRERELEASE)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
            [[ "$WORKFLOW_REF" =~ $TAG_PATTERN ]] || exit 1
          fi
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 2
        with:
          node-version-file: .node-version
      - name: Test update and first-launch guards
        timeout-minutes: 2
        run: node --test scripts/ci/hosted-validation.test.mjs scripts/ci/hosted-release.test.mjs scripts/ci/hosted-update.test.mjs scripts/ci/hosted-metadata.test.mjs
      - name: Validate the real signed 0.1.5 to 0.1.6 update and restart
        timeout-minutes: 15
        env:
          ALLOW_RELEASE_IDENTITY: ${{ inputs.allow_release_identity }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/ci/hosted-update.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 2
        if: always()
        with:
          name: hosted-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hosted-update/*.json
            artifacts/hosted-update/*.log
          if-no-files-found: warn
          retention-days: 14
